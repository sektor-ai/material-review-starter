syntax = "proto3";

package auth.v1;

// AuthService handles email/password sign-in. The session is carried in an
// HttpOnly cookie that the server sets on SignIn and clears on SignOut.
service AuthService {
  rpc SignIn(SignInRequest) returns (SignInResponse) {}
  rpc SignOut(SignOutRequest) returns (SignOutResponse) {}
  // GetMe returns the signed-in user, or Unauthenticated.
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {}
}

enum UserKind {
  USER_KIND_UNSPECIFIED = 0;
  USER_KIND_HUMAN = 1;
  // The review agent. There is one agent user, created by a migration with
  // a fixed id; it cannot sign in.
  USER_KIND_AGENT = 2;
}

// User is embedded wherever an actor appears (issue authors, event actors,
// run starters), so clients never look users up separately.
message User {
  string id = 1;
  string name = 2;
  // Empty for the agent.
  string email = 3;
  UserKind kind = 4;
}

message SignInRequest {
  string email = 1;
  string password = 2;
}

message SignInResponse {
  User user = 1;
}

message SignOutRequest {}

message SignOutResponse {}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
}
